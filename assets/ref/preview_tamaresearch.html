<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>Tamagotchi research — egg, feed, P1 icons</title>
<style>
body{margin:0;padding:20px;background:#0f1115;color:#e6e6e6;font-family:system-ui,sans-serif;}
h1{font-size:17px;margin:0 0 12px;}
h2{font-size:13px;margin:18px 0 8px;color:#9fd0ff;}
.row{display:flex;gap:12px;flex-wrap:wrap;}
.cell{background:#171a21;border:1px solid #262b36;border-radius:10px;padding:10px;text-align:center;min-width:120px;}
.cell h3{font-size:11px;margin:0 0 6px;color:#8b93a1;}
img{image-rendering:pixelated;display:block;margin:0 auto;}
.lg{width:96px;height:96px;object-fit:contain;background:#20242c;border-radius:6px;padding:6px;}
.md{width:64px;height:64px;object-fit:contain;background:#20242c;border-radius:6px;padding:4px;}
</style></head><body>
<h1>Tamagotchi research — Eevee×Tamagotchi egg/feed + original P1 icons</h1>
<h2>Eevee × Tamagotchi (Serebii, monochrome 24×24 — official game sprites)</h2>
<div class="row">
  <div class="cell"><h3>Egg (egg stage)</h3><img class="lg" src="serebii/egg.png"></div>
  <div class="cell"><h3>Eevee</h3><img class="lg" src="serebii/eevee.png"></div>
  <div class="cell"><h3>Eevee feed</h3><img class="lg" src="serebii/eeveefeed.png"></div>
  <div class="cell"><h3>Games</h3><img class="lg" src="serebii/games.png"></div>
</div>
<h2>Original P1 status icons (fpga-tamagotchi, extracted)</h2>
<div class="row">
  <div class="cell"><h3>food</h3><img class="md" src="tamagotchi_original/source_food.png"></div>
  <div class="cell"><h3>bathroom (poop)</h3><img class="md" src="tamagotchi_original/source_bathroom.png"></div>
  <div class="cell"><h3>lights</h3><img class="md" src="tamagotchi_original/source_lights.png"></div>
  <div class="cell"><h3>medicine</h3><img class="md" src="tamagotchi_original/source_medicine.png"></div>
  <div class="cell"><h3>game</h3><img class="md" src="tamagotchi_original/source_game.png"></div>
  <div class="cell"><h3>attention</h3><img class="md" src="tamagotchi_original/source_attention.png"></div>
</div>
</body></html>
