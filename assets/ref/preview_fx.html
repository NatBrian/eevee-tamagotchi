<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>FX CHECK</title>
<style>

  .cell img{display:block;image-rendering:pixelated;}
  .cell span{display:block;font-size:9px;color:#8fa3b8;margin-top:3px;}

<h2>Heart (PIL pixel art) + particle FX (Kenney, transparent)</h2>

  <div class="cell"><img src="prod/particles/magic_01.png" style="width:80px"><span>magic_01</span></div>

  <div class="cell"><img src="prod/particles/circle_03.png" style="width:80px"><span>circle_03</span></div>
  <div class="cell"><img src="prod/particles/smoke_01.png" style="width:80px"><span>smoke_01</span></div>
  <div class="cell"><img src="prod/particles/twirl_01.png" style="width:80px"><span>twirl_01</span></div>
  <div class="cell"><img src="prod/particles/symbol_01.png" style="width:80px"><span>symbol_01</span></div>
  <div class="cell"><img src="prod/particles/symbol_02.png" style="width:80px"><span>symbol_02</span></div>
