<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>Audio audition — Eevee-Tama</title>
<style>
  body{margin:0;padding:16px;background:#111418;color:#e8e8e8;font-family:system-ui,sans-serif;}
  h2{color:#7fd0ff;font-size:15px;margin:14px 0 6px;border-bottom:1px solid #333;padding-bottom:4px;}
  .row{display:flex;gap:6px;flex-wrap:wrap;}
  .cell{background:#1a1f26;border:1px solid #2c333f;border-radius:8px;padding:8px;width:170px;}
  .cell b{display:block;font-size:11px;color:#9fd0ff;margin-bottom:4px;}
  audio{width:100%;height:30px;}
  .note{color:#9aa4b2;font-size:12px;margin:4px 0;}
</style></head><body>
<h1 style="font-size:18px">Audio audition (Kenney, all CC0)</h1>
<p class="note">Pick your favorites — tell me which jingle = day BGM, night BGM, evolution, and which SFX = eat/pet/poop/sick/death. I'll wire them in the rebuild.</p>

<h2>NES jingles (chiptune)</h2><div class="row" id="nes"></div>
<h2>Hit jingles (pop/synth)</h2><div class="row" id="hit"></div>
<h2>Pizzicato jingles</h2><div class="row" id="pizzi"></div>
<h2>Sax jingles</h2><div class="row" id="sax"></div>
<h2>Steel jingles</h2><div class="row" id="steel"></div>
<h2>Interface SFX (UI)</h2><div class="row" id="ui"></div>

<script>
const base = "prod/audio/";
function add(id, file, label) {
  const d = document.createElement('div'); d.className = 'cell';
  d.innerHTML = `<b>${label}</b>`;
  const a = document.createElement('audio'); a.controls = true; a.preload = 'none'; a.src = base + file;
  d.appendChild(a);
  document.getElementById(id).appendChild(d);
}
for (let i = 0; i <= 16; i++) {
  const n = String(i).padStart(2, '0');
  add('nes',  `music-jingles/jingles_NES${n}.ogg`,  `NES${n}`);
  add('hit',  `music-jingles/jingles_HIT${n}.ogg`,  `HIT${n}`);
  add('pizzi',`music-jingles/jingles_PIZZI${n}.ogg`,`PIZZI${n}`);
  add('sax',  `music-jingles/jingles_SAX${n}.ogg`,  `SAX${n}`);
  add('steel',`music-jingles/jingles_STEEL${n}.ogg`,`STEEL${n}`);
}
const ui = ["click_001","click_002","click_003","confirmation_001","confirmation_003","error_001","error_003","glass_001","glass_003","drop_001","drop_003","bong_001","bong_002","open_001","close_001","back_001","maximize_001","minimize_001"];
ui.forEach(f => add('ui', `interface-sounds/Audio/${f}.ogg`, f));
</script>
</body></html>
